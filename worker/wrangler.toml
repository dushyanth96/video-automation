name = "video-automation-studio"
main = "worker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "VIDEO_JOBS"
id = "paste-kv-namespace-id"

[triggers]
crons = ["30 12 * * *"]  # 6PM IST scheduled-upload sweep

